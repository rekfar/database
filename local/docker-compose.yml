name: rekfar

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Microsoft publishes no arm64 image. On Apple Silicon this runs under Docker
    # Desktop's x86-64 emulation: slower to start, but the engine — including the
    # spatial types this schema depends on — behaves the same.
    platform: linux/amd64
    container_name: rekfar-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in local/.env — see .env.example}
    ports:
      - "1433:1433"
    volumes:
      - rekfar-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  rekfar-sql-data:
